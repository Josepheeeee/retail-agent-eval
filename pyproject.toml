[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent-eval"
version = "0.1.0"
description = "Layered evaluation and failure-attribution-driven optimization of retail agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "numpy>=2,<3", "matplotlib>=3.9,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
live = ["deepagents", "langchain-openai", "dspy", "gepa"]
dev = ["pytest>=8,<10"]

[project.scripts]
retail-eval = "retail_eval.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
